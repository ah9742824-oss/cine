<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineBox — دار العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a0c16;
  --panel:#12162a;
  --panel-2:#181d35;
  --gold:#d4af37;
  --gold-soft:#f2dd9a;
  --crimson:#7d1f3a;
  --crimson-soft:#b23a5c;
  --cream:#f4ecd8;
  --muted:#8b91ab;
  --line:rgba(212,175,55,0.18);
  --shadow-gold: 0 0 24px rgba(212,175,55,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Tajawal',sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 20% -10%, rgba(125,31,58,0.35), transparent 60%),
    radial-gradient(ellipse 900px 600px at 90% 0%, rgba(212,175,55,0.12), transparent 55%),
    var(--void);
  color:var(--cream);
  min-height:100vh;
}
::selection{background:var(--gold);color:#1a1005;}

/* ---------- HEADER ---------- */
header{
  position:sticky; top:0; z-index:50;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  padding:16px 40px;
  background:rgba(10,12,22,0.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:50%;
  background:conic-gradient(from 200deg, var(--gold), var(--crimson), var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;color:#150c05;font-size:15px;
  box-shadow:var(--shadow-gold);
}
.brand-text{font-family:'Cinzel',serif;font-weight:700;font-size:24px;letter-spacing:1px;color:var(--gold-soft);}
.brand-sub{display:block;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:3px;margin-top:2px;}

nav{display:flex;gap:10px;}
nav button{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:9px 22px;border-radius:999px;font-size:14px;font-family:'Tajawal';font-weight:500;cursor:pointer;
  transition:.25s;
}
nav button:hover{border-color:var(--gold);color:var(--cream);}
nav button.active{background:linear-gradient(135deg,var(--gold),#a8822a);color:#1a1005;font-weight:700;border-color:transparent;}

.search-wrap{position:relative;min-width:220px;flex:1;max-width:320px;}
.search-wrap input{
  width:100%;padding:10px 40px 10px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--cream);font-family:'Tajawal';font-size:14px;outline:none;transition:.25s;
}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,0.15);}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6;}

#toggleGenres{
  background:var(--panel);border:1px solid var(--line);color:var(--gold-soft);
  padding:9px 18px;border-radius:999px;font-size:14px;cursor:pointer;font-family:'Tajawal';font-weight:500;transition:.25s;
}
#toggleGenres:hover{border-color:var(--gold);}
.genres-filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;width:100%;}
.genres-filter button{
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:6px 16px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.25s;font-family:'Tajawal';
}
.genres-filter button:hover{color:var(--cream);border-color:var(--gold-soft);}
.genres-filter button.active{background:var(--crimson);color:var(--cream);border-color:transparent;}

/* ---------- HERO ---------- */
.hero{
  position:relative;margin:24px 40px 8px;border-radius:26px;overflow:hidden;
  min-height:360px;display:flex;align-items:flex-end;
  border:1px solid var(--line);
}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.55) saturate(1.1);transform:scale(1.02);}
.hero-fade{position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,12,22,.97) 8%, rgba(10,12,22,.55) 55%, rgba(10,12,22,.15) 100%);}
.hero-content{position:relative;padding:34px 38px;max-width:640px;}
.hero-eyebrow{
  font-size:12px;letter-spacing:4px;color:var(--gold-soft);font-weight:700;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.hero-eyebrow::before{content:"";width:26px;height:1px;background:var(--gold);display:inline-block;}
.hero-title{font-family:'Cinzel',serif;font-size:clamp(26px,4vw,42px);font-weight:700;color:var(--cream);line-height:1.25;margin-bottom:10px;}
.hero-desc{color:var(--muted);font-size:14.5px;line-height:1.9;max-width:560px;margin-bottom:16px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hero-meta{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.hero-tag{background:rgba(212,175,55,0.12);border:1px solid var(--line);color:var(--gold-soft);padding:4px 14px;border-radius:999px;font-size:12.5px;}
.hero-cta{
  display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--gold),#a8822a);
  color:#1a1005;font-weight:700;padding:13px 30px;border-radius:999px;text-decoration:none;font-size:15px;
  box-shadow:var(--shadow-gold);transition:.3s;
}
.hero-cta:hover{transform:translateY(-2px) scale(1.03);}

/* ---------- CONTAINER / GRID ---------- */
.container{padding:36px 40px 40px;}
.section-title{
  font-family:'Cinzel',serif;font-size:21px;font-weight:700;color:var(--gold-soft);
  margin-bottom:20px;display:flex;align-items:center;gap:12px;
}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
.result-count{font-family:'Tajawal';font-size:13px;color:var(--muted);font-weight:400;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;}

/* Ticket-style card */
.card{
  background:var(--panel);border-radius:18px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);transition:transform .35s,box-shadow .35s,border-color .35s;
  position:relative;
}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(0,0,0,0.45),var(--shadow-gold);border-color:var(--gold);}
.poster-wrap{position:relative;}
.poster{width:100%;height:270px;object-fit:cover;display:block;background:var(--panel-2);}
.top-ribbon{
  position:absolute;top:12px;right:-2px;background:var(--crimson);color:var(--gold-soft);
  font-size:11px;font-weight:700;padding:5px 12px 5px 16px;letter-spacing:.5px;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10% 50%);
}
.type-chip{
  position:absolute;top:12px;left:12px;background:rgba(10,12,22,0.7);backdrop-filter:blur(4px);
  color:var(--gold-soft);font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);
}
/* perforation tear line, the signature device */
.perf{
  position:relative;height:0;border-top:2px dashed rgba(212,175,55,0.3);margin:0 14px;
}
.perf::before,.perf::after{
  content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--void);
}
.perf::before{right:-23px;}
.perf::after{left:-23px;}
.info{padding:14px;}
.title{font-size:15px;font-weight:700;color:var(--cream);margin-bottom:8px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);}
.rating{display:flex;align-items:center;gap:3px;margin-bottom:8px;}
.rating span{font-size:14px;color:#3a3f57;}
.rating .filled{color:var(--gold);text-shadow:0 0 6px rgba(212,175,55,.5);}
.rating-number{font-size:12px;color:var(--muted);margin-right:4px;}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state span{font-family:'Cinzel',serif;color:var(--gold-soft);font-size:18px;display:block;margin-bottom:8px;}

/* ---------- MODAL ---------- */
#modal{
  display:none;position:fixed;inset:0;background:rgba(5,6,12,.9);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;z-index:100;opacity:0;transition:opacity .3s;padding:20px;
}
#modal.show{display:flex;opacity:1;}
#modalContent{
  background:var(--panel);width:100%;max-width:900px;max-height:90vh;border-radius:22px;overflow:hidden;
  display:grid;grid-template-columns:1fr 1.15fr;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.6);
}
#modalContent img{width:100%;height:100%;object-fit:cover;}
#modalContent>div{padding:32px;overflow:visible;position:relative;}
#modalContent h2{font-family:'Cinzel',serif;font-size:25px;margin-bottom:10px;color:var(--cream);}
#modalContent p{color:var(--muted);line-height:1.85;font-size:14.5px;}
#modalType{
  display:inline-block;padding:5px 16px;border-radius:999px;background:rgba(212,175,55,.12);
  color:var(--gold-soft);margin-bottom:12px;font-size:12.5px;border:1px solid var(--line);
}
#modalGenres{margin-top:14px;color:var(--muted);font-size:13px;}
#modalYear{color:var(--gold-soft);font-family:'Cinzel',serif;font-size:14px;margin-bottom:4px;}
#watchButton{
  display:inline-flex;align-items:center;gap:8px;margin-top:22px;
  background:linear-gradient(135deg,var(--gold),#a8822a);padding:13px 30px;border-radius:999px;
  color:#1a1005;text-decoration:none;font-weight:700;font-size:15px;transition:.3s;box-shadow:var(--shadow-gold);
}
#watchButton:hover{transform:scale(1.05);}
#closeModalBtn{
  position:absolute;top:18px;left:18px;background:var(--panel-2);border:1px solid var(--line);
  width:34px;height:34px;border-radius:50%;color:var(--cream);cursor:pointer;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.25s;
}
#closeModalBtn:hover{border-color:var(--gold);color:var(--gold-soft);}
#modalDesc{max-height:180px;overflow-y:auto;padding-left:6px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;}
#modalDesc::-webkit-scrollbar{width:6px;}
#modalDesc::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px;}
#modalDesc::-webkit-scrollbar-track{background:rgba(212,175,55,.1);}

/* ---------- FOOTER ---------- */
.site-footer{
  background:var(--panel);border-top:1px solid var(--line);text-align:center;padding:26px 20px;margin-top:20px;
}
.footer-content p{font-size:13.5px;color:var(--muted);margin:4px 0;}
.footer-content strong{color:var(--gold-soft);}

/* focus visibility for accessibility */
button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

@media(max-width:640px){
  header{padding:14px 18px;}
  .hero{margin:16px 18px;min-height:300px;}
  .container{padding:0 18px 30px;}
  .card .poster{height:230px;}
  #modalContent{grid-template-columns:1fr;max-height:95vh;}
  #modalContent img{height:200px;}
  #modalContent>div{padding:22px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition:none!important;}
}
</style>
</head>
<body>

<header>
  <div class="brand">

<footer class="site-footer">

    <p>Developed by Ahmed Hany Sayedahmed AbdelWahab</p>

</footer>

/* ---------- normalize genres (trim + fix case duplicates) ---------- */
items.forEach(it => { it.genres = (it.genres||[]).map(g => g.trim()); });

/* ---------- build genre chips ---------- */
let allGenres = [...new Set(items.flatMap(i => i.genres))];
allGenres.forEach(genre => {
  const btn = document.createElement('button');
  btn.textContent = genre;
  btn.onclick = () => filterGenre(genre, btn);
  genresContainer.appendChild(btn);
});

/* ---------- hero: showcase the top-rated title ---------- */
function renderHero(){
  const top = [...items].sort((a,b)=>(b.rating||0)-(a.rating||0))[0];
  if(!top) return;
  heroSection.innerHTML = `
    <div class="hero">
      <div class="hero-bg" style="background-image:url('${top.image.trim()}')"></div>
      <div class="hero-fade"></div>
      <div class="hero-content">
        <div class="hero-eyebrow">الأعلى تقييمًا الآن</div>
        <h1 class="hero-title">${top.title}</h1>
        <p class="hero-desc">${top.description || ''}</p>
        <div class="hero-meta">
          <span class="hero-tag">${top.year}</span>
          <span class="hero-tag">${top.type === 'series' ? 'مسلسل' : 'فيلم'}</span>
          ${generateStars(top.rating||0)}
        </div>
        <a class="hero-cta" href="${top.watchLink||'#'}" target="_blank" rel="noopener">🎬 شاهد الآن</a>
      </div>
    </div>`;
}

function normalize(str){ return (str||'').toLowerCase(); }

function render(){
  grid.innerHTML = '';
  const filtered = items.filter(item =>
    (currentFilter === 'all' || item.type === currentFilter) &&
    (currentGenre === 'all' || item.genres.includes(currentGenre)) &&
    (searchTerm === '' || normalize(item.title).includes(searchTerm))
  );

  resultCount.textContent = filtered.length ? `(${filtered.length})` : '';

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state"><span>لا توجد نتائج</span>جرّب كلمة بحث أو تصنيفًا مختلفًا</div>`;
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const ribbon = (item.rating||0) >= 4.5 ? `<div class="top-ribbon">الأعلى تقييمًا</div>` : '';
    card.innerHTML = `
      <div class="poster-wrap">
        <img class="poster" src="${item.image.trim()}" alt="${item.title}" loading="lazy"
             onerror="this.onerror=null;this.src='${FALLBACK_IMG}';">
        <div class="type-chip">${item.type === 'series' ? 'مسلسل' : 'فيلم'}</div>
        ${ribbon}
      </div>
      <div class="perf"></div>
      <div class="info">
        <div class="title">${item.title}</div>
        ${generateStars(item.rating||0)}
        <div class="meta"><span>${item.year}</span><span>${item.genres[0]||''}</span></div>
      </div>`;
    card.onclick = () => openModal(item);
    grid.appendChild(card);
  });
}

function filter(type, btn){
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = type;
  render();
}

function filterGenre(genre, btn){
  const already = btn.classList.contains('active');
  document.querySelectorAll('.genres-filter button').forEach(b => b.classList.remove('active'));
  currentGenre = already ? 'all' : genre;
  if(!already) btn.classList.add('active');
  render();
}

toggleGenresBtn.onclick = () => {
  const shown = genresContainer.style.display === 'flex';
  genresContainer.style.display = shown ? 'none' : 'flex';
  toggleGenresBtn.textContent = shown ? 'تصنيفات' : 'إخفاء التصنيفات';
};

searchInput.addEventListener('input', e => {
  searchTerm = normalize(e.target.value.trim());
  render();
});

function openModal(item){
  modal.classList.add('show');
  modalImage.src = item.image.trim();
  modalImage.onerror = () => { modalImage.onerror = null; modalImage.src = FALLBACK_IMG; };
  modalTitle.textContent = item.title;
  modalYear.textContent = item.year;
  modalType.textContent = item.type === 'series' ? 'مسلسل' : 'فيلم';
  modalDesc.textContent = item.description || '';
  modalGenres.textContent = item.genres.length ? 'التصنيفات: ' + item.genres.join('، ') : '';
  watchButton.style.display = item.watchLink ? 'inline-flex' : 'none';
  watchButton.href = item.watchLink || '#';
  modalRating.innerHTML = generateStars(item.rating || 0);
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  modal.classList.remove('show');
  document.body.style.overflow = '';
}

modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function generateStars(rate){
  let stars = '';
  for(let i=1;i<=5;i++){
    stars += i <= Math.round(rate) ? '<span class="filled">★</span>' : '<span>★</span>';
  }
  return `<div class="rating">${stars}<span class="rating-number">${rate}</span></div>`;
}

renderHero();
render();
</script>
